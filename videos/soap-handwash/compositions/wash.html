  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const q = (s) => document.querySelectorAll(s);
      const blurIn = (sel, at) =>

      const blurOut = (sel, at) =>

      // initial states

      tl.set("#w-foam .bub", { scale: 0, transformOrigin: "50% 50%" }, 0);

      // 0.0–2.4 hook: germs pop on, words blur in

      tl.fromTo("#w-hook .word", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.09 }, 0.35);
      blurOut("#w-hook .in", 2.18);

      // 2.4–4.4 wet
      tl.fromTo("#w-water", { scaleY: 0, opacity: 1 }, { scaleY: 1, opacity: 1, duration: 0.45, ease: "power2.in" }, 2.4);
      tl.fromTo(".drops ellipse", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out", stagger: 0.05 }, 2.8);
      blurIn("#w-step1 .in", 2.5);
      tl.to("#w-water", { scaleY: 0, transformOrigin: "50% 100%", duration: 0.3, ease: "power2.in" }, 4.0);
      blurOut("#w-step1 .in", 4.2);

      // 4.4–6.4 soap
      blurIn("#w-step2 .in", 4.5);
      tl.fromTo("#w-pumphead", { y: 0 }, { y: 28, duration: 0.18, ease: "power3.in" }, 4.6);
      tl.to("#w-pumphead", { y: 0, duration: 0.4, ease: "expo.out" }, 4.8);
      tl.fromTo("#w-drop", { opacity: 1, x: 0 }, { opacity: 1, x: 270, duration: 0.5, ease: "none", immediateRender: false }, 4.78);
      tl.to("#w-drop", { y: -40, duration: 0.2, ease: "power2.out" }, 4.78);
      tl.to("#w-drop", { y: 20, duration: 0.3, ease: "power2.in" }, 4.98);
      tl.to("#w-drop", { opacity: 0, scale: 1.6, transformOrigin: "50% 50%", duration: 0.15 }, 5.28);
      tl.to(".drops ellipse", { opacity: 0, duration: 0.3 }, 5.3);
      tl.fromTo("#w-foam .bub", { scale: 0, opacity: 1 }, { scale: 0.6, opacity: 1, duration: 0.5, ease: "expo.out", stagger: { each: 0.04, from: "center" } }, 5.3);
      blurOut("#w-step2 .in", 6.2);

      // 6.4–10.6 scrub 20 s (accelerated)
      blurIn("#w-step3 .in", 6.5);
      blurIn("#w-step3sub .in", 6.9);
      tl.fromTo("#w-timer", { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, 6.7);
      blurIn("#w-timernote .in", 6.9);
      tl.fromTo("#w-handL", { x: 0 }, { x: 26, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 13 }, 6.6);
      tl.fromTo("#w-handR", { x: 0 }, { x: -26, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 13 }, 6.6);
      tl.fromTo("#w-foam", { x: 0 }, { x: 10, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 13 }, 6.6);
      tl.to("#w-foam .bub", { scale: 1, duration: 1.2, ease: "power2.out", stagger: { each: 0.05, from: "random" } }, 6.7);
      tl.to(".germ", { scale: 0, duration: 0.35, ease: "power3.in", stagger: { each: 0.3, from: "end" } }, 7.0);
      tl.fromTo("#w-ring", { attr: { "stroke-dashoffset": 703.7 } }, { attr: { "stroke-dashoffset": 0 }, duration: 3.6, ease: "none" }, 6.8);
      const counter = { v: 0 };
      const countEl = document.getElementById("w-count");
      tl.fromTo(counter, { v: 0 }, {
        v: 20, duration: 3.6, ease: "none",
        onUpdate: () => { countEl.textContent = String(Math.floor(counter.v + 0.0001)); },
      }, 6.8);
      tl.to(["#w-step3 .in", "#w-step3sub .in", "#w-timernote .in"], { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power2.in" }, 10.4);
      tl.to("#w-timer", { opacity: 0, scale: 0.9, duration: 0.18, ease: "power2.in" }, 10.4);

      // 10.6–12.6 rinse & dry
      blurIn("#w-step4 .in", 10.7);
      tl.fromTo("#w-water", { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, transformOrigin: "50% 0%", immediateRender: false, duration: 0.4, ease: "power2.in" }, 10.6);
      tl.to("#w-foam .bub", { y: 260, opacity: 0, duration: 0.9, ease: "power2.in", stagger: { each: 0.04, from: "start" } }, 10.9);
      tl.to("#w-water", { scaleY: 0, transformOrigin: "50% 100%", duration: 0.3, ease: "power2.in" }, 12.1);
      blurOut("#w-step4 .in", 12.42);

      // 12.6–15 end line

      window.__timelines = window.__timelines || {};
      window.__timelines["wash"] = tl;
    })();
  </script>
